name: Feature request
description: Suggest an improvement to Droidesk
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in and what's hard about it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Droidesk to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
